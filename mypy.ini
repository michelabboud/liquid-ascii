[mypy]
# MyPy configuration for liquid-ascii

# Python version
python_version = 3.11

# Import discovery
mypy_path = src
namespace_packages = True
explicit_package_bases = True

# Warnings
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Error handling
ignore_missing_imports = True
no_implicit_optional = True
strict_optional = False

# Output
show_error_codes = True
show_error_context = True
pretty = True

# Exclusions
exclude = (
    \.venv/
    | venv/
    | build/
    | dist/
    | \.git/
    | __pycache__/
)

# Per-module options
[mypy-tests.*]
ignore_errors = True

[mypy-setup]
ignore_errors = True
