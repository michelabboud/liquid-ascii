# Ruff configuration for liquid-ascii

# Target Python 3.11+
target-version = "py311"

# Set line length
line-length = 100

# Enable various rule sets
[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in argument defaults
    "C408",  # Unnecessary dict call - rewrite as literal
    "SIM108", # Use ternary operator (sometimes less readable)

    # Acceptable for this project
    "SIM102",  # Nested if statements are sometimes clearer
    "SIM115",  # tempfile.NamedTemporaryFile(delete=False) is required pattern
    "E741",    # Ambiguous variable names (O, I) acceptable for phoneme enums
    "N803",    # Uppercase argument names (R) acceptable for math conventions
    "UP007",   # Union type syntax - legacy style is acceptable
    "B905",    # zip without strict - arrays guaranteed same length
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["E501"]  # Allow long lines in tests

[lint.isort]
known-first-party = ["src"]
