name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ruff:
    name: Ruff (Linter & Formatter)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff check
      run: ruff check .

    - name: Run ruff format check
      run: ruff format --check .

  mypy:
    name: MyPy (Type Checking)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pip install uv

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -r requirements.txt
        uv pip install -r requirements-dev.txt
        uv pip install -e .

    - name: Run mypy
      run: |
        source .venv/bin/activate
        mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [ruff, mypy]
    if: always()

    steps:
    - name: Check lint results
      run: |
        if [ "${{ needs.ruff.result }}" = "success" ]; then
          echo "✅ Ruff checks passed!"
        else
          echo "❌ Ruff checks failed"
        fi

        if [ "${{ needs.mypy.result }}" = "success" ]; then
          echo "✅ MyPy checks passed!"
        elif [ "${{ needs.mypy.result }}" = "skipped" ]; then
          echo "⚠️  MyPy checks skipped"
        else
          echo "⚠️  MyPy checks failed (non-blocking)"
        fi
