# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Grouped + monthly, deliberately.
  #
  # This file previously declared a single ungrouped `pip` entry on a weekly
  # cadence. That produced one PR per package per week and no PR at all for
  # `demo/`, which was never watched — so an absent PR never meant "up to date",
  # it meant nobody was looking. Five PRs accumulated unreviewed for four months.
  #
  # Grouping collapses an update round into one reviewable PR; monthly matches
  # how often this project is actually touched.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"

    ignore:
      # HELD 2026-09-04: numpy 2.5.x and scipy 1.18.x both declare
      # `requires-python >=3.12`, while this project declares `requires-python
      # >=3.11` and CI tests 3.11. Verified against PyPI metadata and proven
      # empirically: `numpy>=2.5.2` makes the 3.11 environment unsatisfiable.
      #
      # Expressed as a VERSION RANGE, not `update-types`. The break is not at a
      # semver-major boundary - 2.4.6 -> 2.5.2 is a minor - it is at the release
      # that moved the Python floor, so a semver-class rule would not catch it.
      #
      # Because the manifests carry no upper bound, Python 3.12/3.13 still
      # resolve 2.5.2 and 1.18.1 naturally; this only stops the declared FLOOR
      # from rising past what 3.11 can install.
      #
      # Owner: Michel (whether to drop Python 3.11 is a support decision).
      # Revisit on that decision, or by 2026-12-04.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      - dependency-name: "scipy"
        versions: [">=1.18.0"]

  # Added 2026-09-04: demo/requirements.txt was outside Dependabot's view.
  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "monthly"
    groups:
      demo-dependencies:
        patterns:
          - "*"

    ignore:
      # HELD 2026-09-04: numpy 2.5.x and scipy 1.18.x both declare
      # `requires-python >=3.12`, while this project declares `requires-python
      # >=3.11` and CI tests 3.11. Verified against PyPI metadata and proven
      # empirically: `numpy>=2.5.2` makes the 3.11 environment unsatisfiable.
      #
      # Expressed as a VERSION RANGE, not `update-types`. The break is not at a
      # semver-major boundary - 2.4.6 -> 2.5.2 is a minor - it is at the release
      # that moved the Python floor, so a semver-class rule would not catch it.
      #
      # Because the manifests carry no upper bound, Python 3.12/3.13 still
      # resolve 2.5.2 and 1.18.1 naturally; this only stops the declared FLOOR
      # from rising past what 3.11 can install.
      #
      # Owner: Michel (whether to drop Python 3.11 is a support decision).
      # Revisit on that decision, or by 2026-12-04.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      - dependency-name: "scipy"
        versions: [">=1.18.0"]
