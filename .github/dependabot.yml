# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Grouped + monthly, deliberately.
  #
  # This file previously declared a single ungrouped `pip` entry on a weekly
  # cadence. That produced one PR per package per week and no PR at all for
  # `demo/`, which was never watched — so an absent PR never meant "up to date",
  # it meant nobody was looking. Five PRs accumulated unreviewed for four months.
  #
  # Grouping collapses an update round into one reviewable PR; monthly matches
  # how often this project is actually touched.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Added 2026-09-04: demo/requirements.txt was outside Dependabot's view.
  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "monthly"
    groups:
      demo-dependencies:
        patterns:
          - "*"
