[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-ascii"
version = "0.1.0"
description = "Terminal-based ASCII art animation with liquid 3D rendering and lip sync"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Liquid ASCII Contributors"}
]
keywords = ["ascii", "animation", "terminal", "tts", "lip-sync", "raymarching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "blessed>=1.25.0",
    "numpy>=2.0.0",
    "edge-tts>=7.2.0",
    "sounddevice>=0.5.3",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
liquid-ascii = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
