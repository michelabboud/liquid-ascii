[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-ascii"
version = "0.2.0"
description = "Terminal-based ASCII art animation with liquid 3D rendering, gestures, and lip sync"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Liquid ASCII Contributors"}
]
maintainers = [
    {name = "Liquid ASCII Contributors"}
]
keywords = [
    "ascii",
    "animation",
    "terminal",
    "tts",
    "lip-sync",
    "raymarching",
    "3d-rendering",
    "sdf",
    "visual-effects",
    "character-animation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/anthropics/liquid-ascii"
Documentation = "https://github.com/anthropics/liquid-ascii/blob/main/README.md"
Repository = "https://github.com/anthropics/liquid-ascii"
Issues = "https://github.com/anthropics/liquid-ascii/issues"
Changelog = "https://github.com/anthropics/liquid-ascii/blob/main/CHANGELOG.md"

dependencies = [
    "blessed>=1.25.0",
    "numpy>=2.0.0",
    "edge-tts>=7.2.0",
    "sounddevice>=0.5.3",
    "scipy>=1.11.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[project.scripts]
liquid-ascii = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
